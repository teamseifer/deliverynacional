<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Finalizar pedido — Point do Açaí</title>
	<link rel="shortcut icon" type="image/jpg" href="../images/Point.png">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://cdn.utmify.com.br/scripts/utms/latest.js" data-utmify-prevent-subids async defer></script>
	<link rel="stylesheet" href="checkout.css">
</head>
<body>
	<header class="top">
		<a href="../index.html" class="voltar">← Voltar</a>
		<img src="../images/Point.png" alt="Point do Açaí" class="logo">
		<h1>Finalize seu pedido</h1>
	</header>

	<main class="wrap">
		<section class="card resumo">
			<h2>Seu pedido</h2>
			<p class="produto" id="resumo-produto">...</p>
			<p class="sub" id="resumo-obs"></p>
			<div class="linha"><span>Subtotal</span><span id="resumo-subtotal">R$ 0,00</span></div>
			<div class="linha"><span>Entrega</span><span id="resumo-entrega">Grátis (60–90 min)</span></div>
			<div class="linha total"><span>Total</span><span id="resumo-total">R$ 0,00</span></div>
		</section>

		<section class="card">
			<h2>Endereço de entrega</h2>
			<div class="grid">
				<label class="full">CEP
					<input type="text" id="cep" inputmode="numeric" maxlength="9" placeholder="00000-000" autocomplete="postal-code">
				</label>
				<label class="full">Rua
					<input type="text" id="rua" placeholder="Rua / Avenida">
				</label>
				<label>Número
					<input type="text" id="numero" placeholder="Nº">
				</label>
				<label>Complemento
					<input type="text" id="complemento" placeholder="Apto, bloco...">
				</label>
				<label class="full">Bairro
					<input type="text" id="bairro" placeholder="Bairro">
				</label>
				<label>Cidade
					<input type="text" id="cidade" placeholder="Cidade">
				</label>
				<label>UF
					<input type="text" id="uf" maxlength="2" placeholder="UF">
				</label>
			</div>
			<p class="cep-msg" id="cep-msg"></p>
		</section>

		<section class="card">
			<h2>Forma de entrega</h2>
			<label class="opcao-entrega">
				<input type="radio" name="tipo_entrega" value="gratis" checked>
				<span>
					<b>Entrega grátis</b>
					<small>Entre 60 e 90 minutos</small>
				</span>
				<strong>Grátis</strong>
			</label>
			<label class="opcao-entrega">
				<input type="radio" name="tipo_entrega" value="rapida">
				<span>
					<b>Entrega rápida</b>
					<small>Até 15 minutos</small>
				</span>
				<strong>R$ 6,00</strong>
			</label>
		</section>

		<section class="card">
			<h2>Seus dados</h2>
			<div class="grid">
				<label class="full">Nome completo
					<input type="text" id="nome" autocomplete="name">
				</label>
				<label>CPF
					<input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00">
				</label>
				<label>WhatsApp
					<input type="tel" id="telefone" placeholder="(00) 00000-0000">
				</label>
				<label class="full">E-mail
					<input type="email" id="email" autocomplete="email" placeholder="seu@email.com">
				</label>
			</div>
		</section>

		<section class="card pagamento">
			<h2>Pagamento</h2>
			<p class="pix-info">Você será direcionado para pagar com <b>PIX</b> após confirmar.</p>
			<button type="button" class="btn-pagar" id="btn-pagar">Gerar PIX e finalizar</button>
			<p class="erro" id="erro"></p>
		</section>
	</main>

	<footer>Point do Açaí · Pagamento seguro via PIX</footer>
	<script src="checkout.js"></script>
</body>
</html>
